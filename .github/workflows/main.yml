name: Instagram Signup on RDP + Record

"on":
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      RDP_USERNAME: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD
          if ([string]::IsNullOrEmpty($password)) { throw "RDP_PASSWORD secret missing" }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -ne $existingUser) {
              Set-LocalUser -Name $username -Password $securePassword -ErrorAction Stop
          } else {
              New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires -UserMayNotChangePassword -Description "Temp RDP" -ErrorAction Stop
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Set-Service -Name "TermService" -StartupType Automatic -ErrorAction Stop
          Restart-Service -Name "TermService" -Force -ErrorAction Stop
          Start-Sleep -Seconds 4
          Write-Host "RDP ready."

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
              $installer = "$env:TEMP\tailscale-setup.exe"
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
              Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait
              Start-Sleep -Seconds 8
          }
          $hostname = "gh-rdp-$($env:GITHUB_RUN_ID)"
          & $ts up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="$hostname" --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "Tailscale failed" }
          Start-Sleep -Seconds 5
          $ip = (& $ts ip -4 | Out-String).Trim()
          Write-Host "Tailscale IP: $ip"
          "TAILSCALE_IP=$ip" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          $iface = Get-NetAdapter | Where-Object { $_.InterfaceDescription -match "Tailscale" }
          if ($iface) {
              New-NetFirewallRule -DisplayName "RDP-Tailscale-Only" -Direction Inbound `
                -Protocol TCP -LocalPort 3389 -Action Allow `
                -InterfaceAlias $iface.Name | Out-Null
          }

      - name: Setup Python + Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chrome
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $null
          foreach ($p in $paths) { if (Test-Path $p) { $chrome = $p; break } }
          if (-not $chrome) {
              choco install googlechrome -y --no-progress
              Start-Sleep -Seconds 8
              foreach ($p in $paths) { if (Test-Path $p) { $chrome = $p; break } }
          }
          if (-not $chrome) { throw "Chrome not found" }
          "CHROME_PATH=$chrome" | Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Install FFmpeg
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
              choco install ffmpeg -y --no-progress
              Start-Sleep -Seconds 8
          }
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) { throw "ffmpeg missing" }

      - name: Prepare Chrome profile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item "C:\temp\ChromeProfile" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Minimize all windows
        shell: powershell
        run: |
          try { (New-Object -ComObject Shell.Application).MinimizeAll() } catch {}
          Start-Sleep -Seconds 2

      - name: Start Chrome with debug port
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\start-chrome.ps1"

      - name: Run recording + Instagram script
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\record.ps1"
          if ($LASTEXITCODE -ne 0) { throw "run failed with $LASTEXITCODE" }

      - name: Debug logs
        if: always()
        shell: powershell
        run: |
          Write-Host "=== click-record.log ==="
          if (Test-Path "C:\temp\click-record.log") { Get-Content "C:\temp\click-record.log" }
          Write-Host "=== ffmpeg-error.log (tail 40) ==="
          if (Test-Path "C:\temp\ffmpeg-error.log") { Get-Content "C:\temp\ffmpeg-error.log" -Tail 40 }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-rdp-record
          path: |
            C:\temp\rdp-click-video.mp4
            C:\temp\rdp-click-screenshot.png
            C:\temp\instagram_signup_filled.png
            C:\temp\instagram_captcha_modal.png
            C:\temp\instagram_captcha_clicked.png
            C:\temp\error_missing_element.png
            C:\temp\click-record.log
            C:\temp\ffmpeg-error.log
          if-no-files-found: warn
          retention-days: 7
